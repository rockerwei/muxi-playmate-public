<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Muxi Playmate — 正在更新</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
        background: #fffbf5;
        color: #1f2937;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        color: #6b7280;
        max-width: 20rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>正在載入最新版本…</h1>
    <p id="status">清除 Playmate 快取中，請稍候。</p>
    <script>
      ;(async function () {
        var status = document.getElementById('status')
        var home = '/muxi-playmate-public/?fresh=' + Date.now()
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations()
            await Promise.all(
              regs.map(function (reg) {
                return reg.unregister()
              }),
            )
          }
          if ('caches' in window) {
            var keys = await caches.keys()
            await Promise.all(
              keys.map(function (key) {
                return caches.delete(key)
              }),
            )
          }
          try {
            localStorage.removeItem('muxilabs-playmate:build-id')
            localStorage.removeItem('muxilabs-playmate:migration-reload')
          } catch (error) {
            console.warn(error)
          }
          try {
            sessionStorage.clear()
          } catch (error) {
            console.warn(error)
          }
          status.textContent = '完成！正在前往 Playmate…'
          location.replace(home)
        } catch (error) {
          console.error(error)
          status.textContent =
            '自動清除失敗。請到 Safari → 設定 → 進階 → 網站資料，刪除 rockerwei.github.io 後再開啟 Playmate。'
        }
      })()
    </script>
  </body>
</html>
