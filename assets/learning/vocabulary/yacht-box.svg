<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Yacht box（帆船收納盒）對應的幼兒學習插圖">
  <title>Yacht box</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- box front face -->
  <rect x="18" y="52" width="66" height="54" rx="4" fill="#FB8C00"/>
  <!-- box right face -->
  <polygon points="84,52 106,40 106,94 84,106" fill="#E65100"/>
  <!-- box top flap left -->
  <polygon points="18,52 40,40 106,40 84,52" fill="#FFA726"/>
  <!-- box crease lines -->
  <line x1="18" y1="52" x2="40" y2="40" stroke="#E65100" stroke-width="1"/>
  <line x1="84" y1="52" x2="106" y2="40" stroke="#BF360C" stroke-width="1"/>
  <!-- subject inside box, scaled and shifted up slightly -->
  <g transform="translate(18,28) scale(0.48)"><title>Yacht</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="24" y="52" width="72" height="24" rx="10" fill="#43A047"/>
    <ellipse cx="36" cy="58" rx="10" ry="6" fill="rgba(255,255,255,0.28)"/>
    <rect x="34" y="42" width="34" height="18" rx="6" fill="#00897B"/>
    <circle cx="38" cy="78" r="10" fill="#334155"/><circle cx="38" cy="78" r="4" fill="#CBD5E1"/>
    <circle cx="82" cy="78" r="10" fill="#334155"/><circle cx="82" cy="78" r="4" fill="#CBD5E1"/></g>
  <!-- box rim highlight -->
  <path d="M18 52 Q51 46 84 52" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
</svg>
