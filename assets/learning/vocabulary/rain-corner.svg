<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Rain corner（雨角落）對應的幼兒學習插圖">
  <title>Rain corner</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- background sheet -->
  <rect x="20" y="44" width="84" height="64" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- sheet lines -->
  <rect x="28" y="56" width="60" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="28" y="66" width="52" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="28" y="76" width="56" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="28" y="86" width="44" height="3" rx="1.5" fill="#E2E8F0"/>
  <!-- corner triangle badge -->
  <polygon points="4,4 72,4 4,72" fill="#E91E63" opacity="0.16"/>
  <polygon points="4,4 58,4 4,58" fill="#E91E63" opacity="0.12"/>
  <!-- subject scaled to top-left corner area -->
  <g transform="translate(-4,-4) scale(0.42)"><title>Rain</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <circle cx="60" cy="52" r="24" fill="#8E24AA"/>
    <ellipse cx="48" cy="44" rx="8" ry="6" fill="rgba(255,255,255,0.28)"/>
    <line x1="60" y1="16" x2="60" y2="8" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="88" x2="60" y2="96" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="52" x2="20" y2="52" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="52" x2="100" y2="52" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/></g>
</svg>
