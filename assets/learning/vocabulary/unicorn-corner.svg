<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Unicorn corner（獨角獸角落）對應的幼兒學習插圖">
  <title>Unicorn corner</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- background sheet -->
  <rect x="20" y="44" width="84" height="64" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- sheet lines -->
  <rect x="28" y="56" width="60" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="28" y="66" width="52" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="28" y="76" width="56" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="28" y="86" width="44" height="3" rx="1.5" fill="#E2E8F0"/>
  <!-- corner triangle badge -->
  <polygon points="4,4 72,4 4,72" fill="#E91E63" opacity="0.16"/>
  <polygon points="4,4 58,4 4,58" fill="#E91E63" opacity="0.12"/>
  <!-- subject scaled to top-left corner area -->
  <g transform="translate(-4,-4) scale(0.42)"><title>Unicorn</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="60" cy="68" rx="28" ry="22" fill="#43A047"/>
    <circle cx="60" cy="42" r="18" fill="#43A047"/>
    <ellipse cx="52" cy="38" rx="7" ry="5" fill="rgba(255,255,255,0.28)"/>
    <circle cx="66" cy="40" r="3" fill="#111827"/><circle cx="67" cy="39" r="1" fill="#FFFFFF"/>
    <ellipse cx="44" cy="34" rx="6" ry="8" fill="#00897B"/><ellipse cx="76" cy="34" rx="6" ry="8" fill="#00897B"/>
    <path d="M36 68 Q28 58 24 48" stroke="#00897B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M84 68 Q92 58 96 48" stroke="#00897B" stroke-width="4" stroke-linecap="round" fill="none"/></g>
</svg>
