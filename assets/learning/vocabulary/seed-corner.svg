<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Seed corner（種子角落）對應的幼兒學習插圖">
  <title>Seed corner</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- background sheet -->
  <rect x="20" y="44" width="84" height="64" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- sheet lines -->
  <rect x="28" y="56" width="60" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="28" y="66" width="52" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="28" y="76" width="56" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="28" y="86" width="44" height="3" rx="1.5" fill="#E2E8F0"/>
  <!-- corner triangle badge -->
  <polygon points="4,4 72,4 4,72" fill="#E91E63" opacity="0.16"/>
  <polygon points="4,4 58,4 4,58" fill="#E91E63" opacity="0.12"/>
  <!-- subject scaled to top-left corner area -->
  <g transform="translate(-4,-4) scale(0.42)"><title>Seed</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="56" y="68" width="8" height="24" rx="3" fill="#1E88E5"/>
    <path d="M60 68 Q42 58 38 42 Q48 50 60 58 Z" fill="#FB8C00"/>
    <path d="M60 68 Q78 58 82 42 Q72 50 60 58 Z" fill="#FB8C00"/>
    <path d="M60 58 Q60 34 60 24 Q68 34 72 44 Q64 44 60 58 Z" fill="#1E88E5"/>
    <ellipse cx="54" cy="36" rx="6" ry="4" fill="rgba(255,255,255,0.28)"/></g>
</svg>
