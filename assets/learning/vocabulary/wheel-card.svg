<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Wheel card（輪子卡）對應的幼兒學習插圖">
  <title>Wheel card</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- card frame -->
  <rect x="14" y="26" width="92" height="66" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <!-- subject scaled to left half -->
  <g transform="translate(16,28) scale(0.465)"><title>Wheel</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="24" y="52" width="72" height="24" rx="10" fill="#43A047"/>
    <ellipse cx="36" cy="58" rx="10" ry="6" fill="rgba(255,255,255,0.28)"/>
    <rect x="34" y="42" width="34" height="18" rx="6" fill="#00897B"/>
    <circle cx="38" cy="78" r="10" fill="#334155"/><circle cx="38" cy="78" r="4" fill="#CBD5E1"/>
    <circle cx="82" cy="78" r="10" fill="#334155"/><circle cx="82" cy="78" r="4" fill="#CBD5E1"/></g>
  <!-- text lines on right -->
  <rect x="70" y="42" width="26" height="4" rx="2" fill="#94A3B8"/>
  <rect x="70" y="52" width="20" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="70" y="61" width="23" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="70" y="70" width="18" height="3" rx="1.5" fill="#E2E8F0"/>
  <!-- corner dot decoration -->
  <circle cx="100" cy="86" r="3" fill="#E2E8F0"/>
</svg>
