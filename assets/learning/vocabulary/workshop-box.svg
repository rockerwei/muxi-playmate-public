<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Workshop box（工作坊收納盒）對應的幼兒學習插圖">
  <title>Workshop box</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- box front face -->
  <rect x="18" y="52" width="66" height="54" rx="4" fill="#FB8C00"/>
  <!-- box right face -->
  <polygon points="84,52 106,40 106,94 84,106" fill="#E65100"/>
  <!-- box top flap left -->
  <polygon points="18,52 40,40 106,40 84,52" fill="#FFA726"/>
  <!-- box crease lines -->
  <line x1="18" y1="52" x2="40" y2="40" stroke="#E65100" stroke-width="1"/>
  <line x1="84" y1="52" x2="106" y2="40" stroke="#BF360C" stroke-width="1"/>
  <!-- subject inside box, scaled and shifted up slightly -->
  <g transform="translate(18,28) scale(0.48)"><title>Workshop</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="28" y="48" width="64" height="40" rx="4" fill="#FB8C00"/>
    <path d="M24 48 L60 24 L96 48 Z" fill="#1E88E5"/>
    <rect x="48" y="64" width="16" height="24" rx="2" fill="#1E88E5"/>
    <rect x="36" y="56" width="14" height="12" rx="2" fill="#E2E8F0"/>
    <rect x="70" y="56" width="14" height="12" rx="2" fill="#E2E8F0"/></g>
  <!-- box rim highlight -->
  <path d="M18 52 Q51 46 84 52" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
</svg>
