<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Unicorn box（獨角獸收納盒）對應的幼兒學習插圖">
  <title>Unicorn box</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- box front face -->
  <rect x="18" y="52" width="66" height="54" rx="4" fill="#FB8C00"/>
  <!-- box right face -->
  <polygon points="84,52 106,40 106,94 84,106" fill="#E65100"/>
  <!-- box top flap left -->
  <polygon points="18,52 40,40 106,40 84,52" fill="#FFA726"/>
  <!-- box crease lines -->
  <line x1="18" y1="52" x2="40" y2="40" stroke="#E65100" stroke-width="1"/>
  <line x1="84" y1="52" x2="106" y2="40" stroke="#BF360C" stroke-width="1"/>
  <!-- subject inside box, scaled and shifted up slightly -->
  <g transform="translate(18,28) scale(0.48)"><title>Unicorn</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="60" cy="68" rx="28" ry="22" fill="#43A047"/>
    <circle cx="60" cy="42" r="18" fill="#43A047"/>
    <ellipse cx="52" cy="38" rx="7" ry="5" fill="rgba(255,255,255,0.28)"/>
    <circle cx="66" cy="40" r="3" fill="#111827"/><circle cx="67" cy="39" r="1" fill="#FFFFFF"/>
    <ellipse cx="44" cy="34" rx="6" ry="8" fill="#00897B"/><ellipse cx="76" cy="34" rx="6" ry="8" fill="#00897B"/>
    <path d="M36 68 Q28 58 24 48" stroke="#00897B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M84 68 Q92 58 96 48" stroke="#00897B" stroke-width="4" stroke-linecap="round" fill="none"/></g>
  <!-- box rim highlight -->
  <path d="M18 52 Q51 46 84 52" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
</svg>
