<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Unicorn sign（獨角獸標示）對應的幼兒學習插圖">
  <title>Unicorn sign</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- pole -->
  <rect x="56" y="76" width="8" height="36" rx="3" fill="#795548"/>
  <!-- sign board shadow -->
  <rect x="17" y="19" width="88" height="60" rx="9" fill="rgba(0,0,0,0.07)"/>
  <!-- sign board -->
  <rect x="14" y="16" width="88" height="60" rx="8" fill="#FFFFFF" stroke="#42A5F5" stroke-width="3.5"/>
  <!-- subject scaled and centered in sign -->
  <g transform="translate(16,18) scale(0.56)"><title>Unicorn</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="60" cy="68" rx="28" ry="22" fill="#43A047"/>
    <circle cx="60" cy="42" r="18" fill="#43A047"/>
    <ellipse cx="52" cy="38" rx="7" ry="5" fill="rgba(255,255,255,0.28)"/>
    <circle cx="66" cy="40" r="3" fill="#111827"/><circle cx="67" cy="39" r="1" fill="#FFFFFF"/>
    <ellipse cx="44" cy="34" rx="6" ry="8" fill="#00897B"/><ellipse cx="76" cy="34" rx="6" ry="8" fill="#00897B"/>
    <path d="M36 68 Q28 58 24 48" stroke="#00897B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M84 68 Q92 58 96 48" stroke="#00897B" stroke-width="4" stroke-linecap="round" fill="none"/></g>
  <!-- sign bolt decorations -->
  <circle cx="22" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="22" cy="68" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="68" r="3" fill="#90CAF9"/>
</svg>
