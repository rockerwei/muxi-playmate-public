<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Orange sign（柳橙標示）對應的幼兒學習插圖">
  <title>Orange sign</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <g transform="translate(0,0) scale(0.82) translate(13,8)"><title>Orange</title>
  <ellipse cx="60" cy="107" rx="28" ry="7" fill="rgba(0,0,0,0.10)"/>
  <!-- orange body -->
  <circle cx="60" cy="66" r="38" fill="#F5891A"/>
  <!-- shade bottom -->
  <ellipse cx="60" cy="84" rx="30" ry="20" fill="#D97010" opacity="0.35"/>
  <!-- surface texture bumps -->
  <circle cx="48" cy="56" r="3" fill="#E07814" opacity="0.5"/>
  <circle cx="68" cy="52" r="3" fill="#E07814" opacity="0.5"/>
  <circle cx="74" cy="66" r="3" fill="#E07814" opacity="0.5"/>
  <circle cx="52" cy="74" r="3" fill="#E07814" opacity="0.5"/>
  <circle cx="40" cy="70" r="2.5" fill="#E07814" opacity="0.4"/>
  <circle cx="78" cy="78" r="2.5" fill="#E07814" opacity="0.4"/>
  <!-- highlight -->
  <ellipse cx="46" cy="52" rx="10" ry="7" fill="rgba(255,255,255,0.28)" transform="rotate(-20 46 52)"/>
  <!-- stem -->
  <path d="M60 28 C60 20 64 14 66 12" stroke="#5a8a28" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- leaf -->
  <path d="M64 18 C70 12 78 16 74 24 C70 30 62 26 64 18 Z" fill="#4a9030"/>
  <path d="M64 18 C70 14 75 18 71 23" stroke="#3a7820" stroke-width="1" fill="none"/>
  <!-- navel top -->
  <circle cx="60" cy="30" r="5" fill="#D97010" opacity="0.5"/>
  <circle cx="60" cy="30" r="3" fill="#E8A830" opacity="0.4"/>
  <!-- navel bottom -->
  <ellipse cx="60" cy="100" rx="6" ry="4" fill="#D97010" opacity="0.6"/></g><rect x="78" y="18" width="24" height="16" rx="3" fill="#38BDF8"/><rect x="87" y="34" width="6" height="14" fill="#64748B"/>
</svg>
