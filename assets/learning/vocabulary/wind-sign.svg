<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Wind sign（風標示）對應的幼兒學習插圖">
  <title>Wind sign</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- pole -->
  <rect x="56" y="76" width="8" height="36" rx="3" fill="#795548"/>
  <!-- sign board shadow -->
  <rect x="17" y="19" width="88" height="60" rx="9" fill="rgba(0,0,0,0.07)"/>
  <!-- sign board -->
  <rect x="14" y="16" width="88" height="60" rx="8" fill="#FFFFFF" stroke="#42A5F5" stroke-width="3.5"/>
  <!-- subject scaled and centered in sign -->
  <g transform="translate(16,18) scale(0.56)"><title>Wind</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <circle cx="60" cy="52" r="24" fill="#43A047"/>
    <ellipse cx="48" cy="44" rx="8" ry="6" fill="rgba(255,255,255,0.28)"/>
    <line x1="60" y1="16" x2="60" y2="8" stroke="#00897B" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="88" x2="60" y2="96" stroke="#00897B" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="52" x2="20" y2="52" stroke="#00897B" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="52" x2="100" y2="52" stroke="#00897B" stroke-width="3" stroke-linecap="round"/></g>
  <!-- sign bolt decorations -->
  <circle cx="22" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="22" cy="68" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="68" r="3" fill="#90CAF9"/>
</svg>
