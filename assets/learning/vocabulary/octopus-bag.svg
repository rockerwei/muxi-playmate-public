<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Octopus bag（章魚收納袋）對應的幼兒學習插圖">
  <title>Octopus bag</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- bag body -->
  <path d="M28 50 Q26 34 60 32 Q94 34 92 50 L96 100 Q96 106 60 106 Q24 106 24 100 Z"
        fill="#4CAF50"/>
  <!-- bag shine -->
  <path d="M36 50 Q34 38 60 36 Q76 36 82 44"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" stroke-linecap="round"/>
  <!-- handles -->
  <path d="M42 50 Q42 26 54 24 Q60 22 66 24 Q78 26 78 50"
        fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
  <!-- subject printed on bag, scaled and centered -->
  <g transform="translate(24,50) scale(0.48)"><title>Octopus</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="60" cy="62" rx="34" ry="22" fill="#6D4C41"/>
      <ellipse cx="48" cy="54" rx="10" ry="6" fill="rgba(255,255,255,0.28)"/>
      <path d="M28 62 Q18 58 14 52 Q22 60 28 62" fill="#E53935"/>
      <circle cx="78" cy="54" r="4" fill="#111827"/><circle cx="79" cy="53" r="1.2" fill="#FFFFFF"/>
      <path d="M86 58 Q94 62 98 58" fill="none" stroke="#E53935" stroke-width="3" stroke-linecap="round"/></g>
</svg>
