<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Orchid card（蘭花卡）對應的幼兒學習插圖">
  <title>Orchid card</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- card frame -->
  <rect x="14" y="26" width="92" height="66" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <!-- subject scaled to left half -->
  <g transform="translate(16,28) scale(0.465)"><title>Orchid</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="56" y="68" width="8" height="24" rx="3" fill="#FB8C00"/>
    <path d="M60 68 Q42 58 38 42 Q48 50 60 58 Z" fill="#546E7A"/>
    <path d="M60 68 Q78 58 82 42 Q72 50 60 58 Z" fill="#546E7A"/>
    <path d="M60 58 Q60 34 60 24 Q68 34 72 44 Q64 44 60 58 Z" fill="#FB8C00"/>
    <ellipse cx="54" cy="36" rx="6" ry="4" fill="rgba(255,255,255,0.28)"/></g>
  <!-- text lines on right -->
  <rect x="70" y="42" width="26" height="4" rx="2" fill="#94A3B8"/>
  <rect x="70" y="52" width="20" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="70" y="61" width="23" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="70" y="70" width="18" height="3" rx="1.5" fill="#E2E8F0"/>
  <!-- corner dot decoration -->
  <circle cx="100" cy="86" r="3" fill="#E2E8F0"/>
</svg>
