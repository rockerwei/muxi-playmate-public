<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Triangle sign（三角形標示）對應的幼兒學習插圖">
  <title>Triangle sign</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- pole -->
  <rect x="56" y="76" width="8" height="36" rx="3" fill="#795548"/>
  <!-- sign board shadow -->
  <rect x="17" y="19" width="88" height="60" rx="9" fill="rgba(0,0,0,0.07)"/>
  <!-- sign board -->
  <rect x="14" y="16" width="88" height="60" rx="8" fill="#FFFFFF" stroke="#42A5F5" stroke-width="3.5"/>
  <!-- subject scaled and centered in sign -->
  <g transform="translate(16,18) scale(0.56)"><title>Triangle</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="30" y="34" width="60" height="52" rx="8" fill="#FDD835" stroke="#8E24AA" stroke-width="3"/>
    <ellipse cx="42" cy="46" rx="10" ry="8" fill="rgba(255,255,255,0.28)"/></g>
  <!-- sign bolt decorations -->
  <circle cx="22" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="22" cy="68" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="68" r="3" fill="#90CAF9"/>
</svg>
