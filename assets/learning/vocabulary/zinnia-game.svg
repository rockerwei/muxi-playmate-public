<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Zinnia game（百日草遊戲）對應的幼兒學習插圖">
  <title>Zinnia game</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- game board base -->
  <rect x="12" y="22" width="96" height="80" rx="8" fill="#FFF9C4"/>
  <rect x="16" y="26" width="88" height="72" rx="6" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>
  <!-- grid lines horizontal -->
  <line x1="16" y1="50" x2="104" y2="50" stroke="#F9A825" stroke-width="1.2"/>
  <line x1="16" y1="68" x2="104" y2="68" stroke="#F9A825" stroke-width="1.2"/>
  <!-- grid lines vertical -->
  <line x1="46" y1="26" x2="46" y2="98" stroke="#F9A825" stroke-width="1.2"/>
  <line x1="74" y1="26" x2="74" y2="98" stroke="#F9A825" stroke-width="1.2"/>
  <!-- cell dots / squares decorations -->
  <circle cx="31" cy="38" r="4" fill="#FFCC02" opacity="0.6"/>
  <circle cx="60" cy="38" r="4" fill="#FF7043" opacity="0.6"/>
  <circle cx="89" cy="79" r="4" fill="#66BB6A" opacity="0.6"/>
  <circle cx="31" cy="79" r="4" fill="#42A5F5" opacity="0.6"/>
  <!-- subject as token, scaled, centered in middle-right cell -->
  <g transform="translate(48,46) scale(0.40)"><title>Zinnia</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="56" y="68" width="8" height="24" rx="3" fill="#FDD835"/>
    <path d="M60 68 Q42 58 38 42 Q48 50 60 58 Z" fill="#EC407A"/>
    <path d="M60 68 Q78 58 82 42 Q72 50 60 58 Z" fill="#EC407A"/>
    <path d="M60 58 Q60 34 60 24 Q68 34 72 44 Q64 44 60 58 Z" fill="#FDD835"/>
    <ellipse cx="54" cy="36" rx="6" ry="4" fill="rgba(255,255,255,0.28)"/></g>
</svg>
