<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Tree bag（樹收納袋）對應的幼兒學習插圖">
  <title>Tree bag</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- bag body -->
  <path d="M28 50 Q26 34 60 32 Q94 34 92 50 L96 100 Q96 106 60 106 Q24 106 24 100 Z"
        fill="#4CAF50"/>
  <!-- bag shine -->
  <path d="M36 50 Q34 38 60 36 Q76 36 82 44"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" stroke-linecap="round"/>
  <!-- handles -->
  <path d="M42 50 Q42 26 54 24 Q60 22 66 24 Q78 26 78 50"
        fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
  <!-- subject printed on bag, scaled and centered -->
  <g transform="translate(24,50) scale(0.48)"><title>Tree</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="56" y="68" width="8" height="24" rx="3" fill="#E53935"/>
    <path d="M60 68 Q42 58 38 42 Q48 50 60 58 Z" fill="#6D4C41"/>
    <path d="M60 68 Q78 58 82 42 Q72 50 60 58 Z" fill="#6D4C41"/>
    <path d="M60 58 Q60 34 60 24 Q68 34 72 44 Q64 44 60 58 Z" fill="#E53935"/>
    <ellipse cx="54" cy="36" rx="6" ry="4" fill="rgba(255,255,255,0.28)"/></g>
</svg>
