<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Red train sign（紅色火車標示）對應的幼兒學習插圖">
  <title>Red train sign</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- pole -->
  <rect x="56" y="76" width="8" height="36" rx="3" fill="#795548"/>
  <!-- sign board shadow -->
  <rect x="17" y="19" width="88" height="60" rx="9" fill="rgba(0,0,0,0.07)"/>
  <!-- sign board -->
  <rect x="14" y="16" width="88" height="60" rx="8" fill="#FFFFFF" stroke="#42A5F5" stroke-width="3.5"/>
  <!-- subject scaled and centered in sign -->
  <g transform="translate(16,18) scale(0.56)"><title>Red train</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="24" y="52" width="72" height="24" rx="10" fill="#1E88E5"/>
    <ellipse cx="36" cy="58" rx="10" ry="6" fill="rgba(255,255,255,0.28)"/>
    <rect x="34" y="42" width="34" height="18" rx="6" fill="#6D4C41"/>
    <circle cx="38" cy="78" r="10" fill="#334155"/><circle cx="38" cy="78" r="4" fill="#CBD5E1"/>
    <circle cx="82" cy="78" r="10" fill="#334155"/><circle cx="82" cy="78" r="4" fill="#CBD5E1"/></g>
  <!-- sign bolt decorations -->
  <circle cx="22" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="24" r="3" fill="#90CAF9"/>
  <circle cx="22" cy="68" r="3" fill="#90CAF9"/>
  <circle cx="98" cy="68" r="3" fill="#90CAF9"/>
</svg>
