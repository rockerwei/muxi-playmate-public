<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Xenops bird bag（翹嘴雀收納袋）對應的幼兒學習插圖">
  <title>Xenops bird bag</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- bag body -->
  <path d="M28 50 Q26 34 60 32 Q94 34 92 50 L96 100 Q96 106 60 106 Q24 106 24 100 Z"
        fill="#4CAF50"/>
  <!-- bag shine -->
  <path d="M36 50 Q34 38 60 36 Q76 36 82 44"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" stroke-linecap="round"/>
  <!-- handles -->
  <path d="M42 50 Q42 26 54 24 Q60 22 66 24 Q78 26 78 50"
        fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
  <!-- subject printed on bag, scaled and centered -->
  <g transform="translate(24,50) scale(0.48)"><title>Xenops bird</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="58" cy="66" rx="24" ry="18" fill="#1E88E5"/>
      <circle cx="72" cy="48" r="14" fill="#1E88E5"/>
      <path d="M84 48 L96 46 L84 52 Z" fill="#6D4C41"/>
      <circle cx="76" cy="46" r="3" fill="#111827"/><circle cx="77" cy="45" r="1" fill="#FFFFFF"/>
      <path d="M42 66 Q30 72 24 64" fill="#6D4C41"/></g>
</svg>
