<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Red train book（紅色火車圖畫書）對應的幼兒學習插圖">
  <title>Red train book</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- book shadow -->
  <rect x="17" y="25" width="88" height="66" rx="5" fill="rgba(0,0,0,0.08)"/>
  <!-- left page / back cover -->
  <rect x="14" y="22" width="46" height="64" rx="4" fill="#BBDEFB"/>
  <!-- left page lines -->
  <rect x="20" y="32" width="30" height="2.5" rx="1.25" fill="#90CAF9"/>
  <rect x="20" y="40" width="26" height="2.5" rx="1.25" fill="#90CAF9"/>
  <rect x="20" y="48" width="28" height="2.5" rx="1.25" fill="#90CAF9"/>
  <rect x="20" y="56" width="22" height="2.5" rx="1.25" fill="#90CAF9"/>
  <!-- right cover -->
  <rect x="60" y="22" width="46" height="64" rx="4" fill="#1976D2"/>
  <!-- book spine -->
  <rect x="55" y="22" width="10" height="64" rx="2" fill="#1565C0"/>
  <line x1="60" y1="22" x2="60" y2="86" stroke="#0D47A1" stroke-width="1"/>
  <!-- subject on right cover, scaled and offset -->
  <g transform="translate(60,22) scale(0.48)"><title>Red train</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="24" y="52" width="72" height="24" rx="10" fill="#1E88E5"/>
    <ellipse cx="36" cy="58" rx="10" ry="6" fill="rgba(255,255,255,0.28)"/>
    <rect x="34" y="42" width="34" height="18" rx="6" fill="#6D4C41"/>
    <circle cx="38" cy="78" r="10" fill="#334155"/><circle cx="38" cy="78" r="4" fill="#CBD5E1"/>
    <circle cx="82" cy="78" r="10" fill="#334155"/><circle cx="82" cy="78" r="4" fill="#CBD5E1"/></g>
  <!-- right cover bottom label -->
  <rect x="65" y="76" width="36" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>
  <!-- page edges top -->
  <path d="M14 22 Q60 18 106 22" fill="none" stroke="#E3F2FD" stroke-width="1.5"/>
</svg>
