    <circle cx="82" cy="78" r="10" fill="#334155"/><circle cx="82" cy="78" r="4" fill="#CBD5E1"/></g>
  <!-- frame corner accents -->
  <rect x="12" y="18" width="10" height="10" rx="2" fill="#6D4C41"/>
