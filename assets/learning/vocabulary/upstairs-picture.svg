<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Upstairs picture（樓上圖片）對應的幼兒學習插圖">
  <title>Upstairs picture</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- outer wooden frame -->
  <rect x="12" y="18" width="96" height="78" rx="5" fill="#8B5E3C"/>
  <!-- inner mat -->
  <rect x="20" y="26" width="80" height="62" rx="3" fill="#FDF6EC"/>
  <!-- white canvas -->
  <rect x="24" y="30" width="72" height="54" rx="2" fill="#FFFFFF"/>
  <!-- subject scaled and centered in canvas -->
  <g transform="translate(24,30) scale(0.60)"><title>Upstairs</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <rect x="28" y="48" width="64" height="40" rx="4" fill="#6D4C41"/>
    <path d="M24 48 L60 24 L96 48 Z" fill="#E53935"/>
    <rect x="48" y="64" width="16" height="24" rx="2" fill="#E53935"/>
    <rect x="36" y="56" width="14" height="12" rx="2" fill="#E2E8F0"/>
    <rect x="70" y="56" width="14" height="12" rx="2" fill="#E2E8F0"/></g>
  <!-- frame corner accents -->
  <rect x="12" y="18" width="10" height="10" rx="2" fill="#6D4C41"/>
  <rect x="98" y="18" width="10" height="10" rx="2" fill="#6D4C41"/>
  <rect x="12" y="86" width="10" height="10" rx="2" fill="#6D4C41"/>
  <rect x="98" y="86" width="10" height="10" rx="2" fill="#6D4C41"/>
</svg>
