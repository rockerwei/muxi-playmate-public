  <!-- handles -->
  <path d="M42 50 Q42 26 54 24 Q60 22 66 24 Q78 26 78 50"
        fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
  <!-- subject printed on bag, scaled and centered -->
  <g transform="translate(24,50) scale(0.48)"><title>Ukulele</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <ellipse cx="42" cy="78" rx="16" ry="12" fill="#E53935"/>
    <rect x="54" y="30" width="6" height="48" fill="#43A047"/>
    <path d="M60 30 Q78 24 84 34 Q78 42 60 36" fill="#43A047"/>
    <ellipse cx="40" cy="72" rx="6" ry="4" fill="rgba(255,255,255,0.28)"/></g>
</svg>
