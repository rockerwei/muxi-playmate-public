<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Yogurt box（優格收納盒）對應的幼兒學習插圖">
  <title>Yogurt box</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- box front face -->
  <rect x="18" y="52" width="66" height="54" rx="4" fill="#FB8C00"/>
  <!-- box right face -->
  <polygon points="84,52 106,40 106,94 84,106" fill="#E65100"/>
  <!-- box top flap left -->
  <polygon points="18,52 40,40 106,40 84,52" fill="#FFA726"/>
  <!-- box crease lines -->
  <line x1="18" y1="52" x2="40" y2="40" stroke="#E65100" stroke-width="1"/>
  <line x1="84" y1="52" x2="106" y2="40" stroke="#BF360C" stroke-width="1"/>
  <!-- subject inside box, scaled and shifted up slightly -->
  <g transform="translate(18,28) scale(0.48)"><title>Yogurt</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <path d="M60 28 C42 28 30 42 30 62 C30 84 44 98 60 98 C76 98 90 84 90 62 C90 42 78 28 60 28 Z" fill="#00897B"/>
    <ellipse cx="45" cy="48" rx="9" ry="6" fill="rgba(255,255,255,0.28)"/>
    <path d="M60 28 C60 18 66 12 70 10" stroke="#EC407A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M64 14 C70 8 78 10 76 18 C74 24 65 22 64 14 Z" fill="#EC407A"/></g>
  <!-- box rim highlight -->
  <path d="M18 52 Q51 46 84 52" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
</svg>
