<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="與英文單字 Rain picture（雨圖片）對應的幼兒學習插圖">
  <title>Rain picture</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  
  <!-- outer wooden frame -->
  <rect x="12" y="18" width="96" height="78" rx="5" fill="#8B5E3C"/>
  <!-- inner mat -->
  <rect x="20" y="26" width="80" height="62" rx="3" fill="#FDF6EC"/>
  <!-- white canvas -->
  <rect x="24" y="30" width="72" height="54" rx="2" fill="#FFFFFF"/>
  <!-- subject scaled and centered in canvas -->
  <g transform="translate(24,30) scale(0.60)"><title>Rain</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <circle cx="60" cy="52" r="24" fill="#8E24AA"/>
    <ellipse cx="48" cy="44" rx="8" ry="6" fill="rgba(255,255,255,0.28)"/>
    <line x1="60" y1="16" x2="60" y2="8" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="88" x2="60" y2="96" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="52" x2="20" y2="52" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="52" x2="100" y2="52" stroke="#546E7A" stroke-width="3" stroke-linecap="round"/></g>
  <!-- frame corner accents -->
  <rect x="12" y="18" width="10" height="10" rx="2" fill="#6D4C41"/>
  <rect x="98" y="18" width="10" height="10" rx="2" fill="#6D4C41"/>
  <rect x="12" y="86" width="10" height="10" rx="2" fill="#6D4C41"/>
  <rect x="98" y="86" width="10" height="10" rx="2" fill="#6D4C41"/>
</svg>
