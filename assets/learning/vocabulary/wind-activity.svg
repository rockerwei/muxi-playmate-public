  <rect x="22" y="52" width="50" height="2.5" rx="1.25" fill="#E2E8F0"/>
  <rect x="22" y="62" width="54" height="2.5" rx="1.25" fill="#E2E8F0"/>
  <rect x="22" y="72" width="46" height="2.5" rx="1.25" fill="#E2E8F0"/>
  <rect x="22" y="82" width="52" height="2.5" rx="1.25" fill="#E2E8F0"/>
  <rect x="22" y="92" width="40" height="2.5" rx="1.25" fill="#E2E8F0"/>
  <!-- small subject top-right -->
  <g transform="translate(64,26) scale(0.38)"><title>Wind</title>
  <rect width="120" height="120" rx="16" fill="#FFF8F0"/>
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="rgba(0,0,0,0.08)"/>
  <circle cx="60" cy="52" r="24" fill="#43A047"/>
    <ellipse cx="48" cy="44" rx="8" ry="6" fill="rgba(255,255,255,0.28)"/>
