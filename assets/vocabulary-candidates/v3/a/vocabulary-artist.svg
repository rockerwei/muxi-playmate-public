  <rect x="49" y="17" width="3" height="66" rx="1" fill="#6B4226"/>
  <rect x="63" y="17" width="3" height="66" rx="1" fill="#6B4226"/>
  <rect x="77" y="17" width="3" height="66" rx="1" fill="#6B4226"/>

  <!-- ── Heaven beads (above divider, 1 per rod) ── -->
  <!-- Rod 1 -->
  <ellipse cx="22" cy="33" rx="9" ry="7" fill="#FF6B6B"/>
  <ellipse cx="22" cy="30" rx="7" ry="4" fill="#FF9898" opacity="0.55"/>
