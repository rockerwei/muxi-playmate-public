  <ellipse cx="22" cy="63" rx="9" ry="7" fill="#4ECDC4"/>
  <ellipse cx="22" cy="60" rx="7" ry="4" fill="#80E8E2" opacity="0.55"/>
  <ellipse cx="22" cy="75" rx="9" ry="7" fill="#FFE66D"/>
  <ellipse cx="22" cy="72" rx="7" ry="4" fill="#FFF5A0" opacity="0.55"/>
  <!-- Rod 2: yellow + teal -->
  <ellipse cx="36" cy="63" rx="9" ry="7" fill="#FFE66D"/>
  <ellipse cx="36" cy="60" rx="7" ry="4" fill="#FFF5A0" opacity="0.55"/>
  <ellipse cx="36" cy="75" rx="9" ry="7" fill="#4ECDC4"/>
  <ellipse cx="36" cy="72" rx="7" ry="4" fill="#80E8E2" opacity="0.55"/>
  <!-- Rod 3: teal + yellow -->
  <ellipse cx="50" cy="63" rx="9" ry="7" fill="#4ECDC4"/>
  <ellipse cx="50" cy="60" rx="7" ry="4" fill="#80E8E2" opacity="0.55"/>
  <ellipse cx="50" cy="75" rx="9" ry="7" fill="#FFE66D"/>
  <ellipse cx="50" cy="72" rx="7" ry="4" fill="#FFF5A0" opacity="0.55"/>
  <!-- Rod 4: yellow + teal -->
  <ellipse cx="64" cy="63" rx="9" ry="7" fill="#FFE66D"/>
  <ellipse cx="64" cy="60" rx="7" ry="4" fill="#FFF5A0" opacity="0.55"/>
  <ellipse cx="64" cy="75" rx="9" ry="7" fill="#4ECDC4"/>
  <ellipse cx="64" cy="72" rx="7" ry="4" fill="#80E8E2" opacity="0.55"/>
  <!-- Rod 5: teal + yellow -->
  <ellipse cx="78" cy="63" rx="9" ry="7" fill="#4ECDC4"/>
  <ellipse cx="78" cy="60" rx="7" ry="4" fill="#80E8E2" opacity="0.55"/>
  <ellipse cx="78" cy="75" rx="9" ry="7" fill="#FFE66D"/>
