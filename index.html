    <div id="root">
      <div id="boot-fallback" role="status" aria-live="polite">Playmate 載入中…</div>
    </div>
      <script id="pwa-bootstrap">(function () {
  var BOOT_TIMEOUT_MS = 15000;
  var BOOT_RELOAD_KEY = 'muxilabs-playmate:boot-manual-reload-count';
  var BUILD_ID = 'f843ecc';

  function removeBootFallback() {
    var fallback = document.getElementById('boot-fallback');
    if (fallback) fallback.remove();
  }

  window.__MUXI_BOOT_OK__ = function () {
    removeBootFallback();
  };

  function showBootFailure(code) {
    var root = document.getElementById('root');
    if (!root) return;
    removeBootFallback();
    root.innerHTML =
      '<div id="boot-failure" role="alert" style="font-family:system-ui,sans-serif;padding:24px;text-align:center;max-width:420px;margin:40px auto;">' +
      '<p style="font-size:18px;font-weight:700;margin:0 0 8px;">Playmate 暫時無法啟動</p>' +
      '<p style="color:#666;margin:0 0 16px;">錯誤代碼：' +
      code +
      '</p>' +
      '<button type="button" id="boot-reload-btn" style="font-size:16px;padding:12px 20px;border-radius:999px;border:none;background:#7C3AED;color:#fff;">重新載入</button>' +
      '</div>';
    var btn = document.getElementById('boot-reload-btn');
    if (btn) {
      btn.addEventListener('click', function () {
        var count = 0;
        try {
          count = parseInt(sessionStorage.getItem(BOOT_RELOAD_KEY) || '0', 10) || 0;
        } catch (e) {}
        if (count >= 3) return;
        try {
          sessionStorage.setItem(BOOT_RELOAD_KEY, String(count + 1));
        } catch (e2) {}
        window.location.reload();
      });
    }
  }

  window.addEventListener('error', function (event) {
    if (event.error) {
      console.error('[boot-fallback] uncaught error:', event.error);
    }
  });

  window.addEventListener('unhandledrejection', function (event) {
    console.error('[boot-fallback] unhandled rejection:', event.reason);
  });

  setTimeout(function () {
    var root = document.getElementById('root');
    var fallback = document.getElementById('boot-fallback');
    var mounted = root && root.querySelector('[data-testid="app-shell"]');
    if (!mounted && fallback) {
      showBootFailure('BOOT_TIMEOUT_' + BUILD_ID);
    }
  }, BOOT_TIMEOUT_MS);
})();</script>
